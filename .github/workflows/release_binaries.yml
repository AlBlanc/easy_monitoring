name: Build & Publish Precompiled Native Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Universal Binary (arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Compile Universal dylib
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --target aarch64-apple-darwin
          cargo build --manifest-path rust/Cargo.toml --release --target x86_64-apple-darwin
          mkdir -p prebuilt/macos
          lipo -create \
            rust/target/aarch64-apple-darwin/release/libeasy_monitoring.dylib \
            rust/target/x86_64-apple-darwin/release/libeasy_monitoring.dylib \
            -output prebuilt/macos/libeasy_monitoring.dylib
          install_name_tool -id "@rpath/libeasy_monitoring.dylib" prebuilt/macos/libeasy_monitoring.dylib
          mkdir -p macos/easy_monitoring/Sources/easy_monitoring/Resources
          cp prebuilt/macos/libeasy_monitoring.dylib macos/easy_monitoring/Sources/easy_monitoring/Resources/libeasy_monitoring.dylib
          cp prebuilt/macos/libeasy_monitoring.dylib libeasy_monitoring-macos-universal.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: libeasy_monitoring-macos-universal.dylib

  build-ios:
    name: Build iOS Static Libraries (arm64 + simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Compile iOS static library (.a)
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --target aarch64-apple-ios
          mkdir -p prebuilt/ios
          cp rust/target/aarch64-apple-ios/release/libeasy_monitoring.a prebuilt/ios/libeasy_monitoring.a
          cp prebuilt/ios/libeasy_monitoring.a libeasy_monitoring-ios-arm64.a
      - uses: actions/upload-artifact@v4
        with:
          name: ios-binary
          path: libeasy_monitoring-ios-arm64.a

  build-linux:
    name: Build Linux Binary (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libdrm-dev
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Compile Linux shared library (.so)
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --target x86_64-unknown-linux-gnu
          mkdir -p prebuilt/linux
          cp rust/target/x86_64-unknown-linux-gnu/release/libeasy_monitoring.so prebuilt/linux/libeasy_monitoring.so
          cp prebuilt/linux/libeasy_monitoring.so libeasy_monitoring-linux-x86_64.so
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: libeasy_monitoring-linux-x86_64.so

  build-android:
    name: Build Android Binaries (arm64-v8a, armeabi-v7a, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Compile Android JNI libraries (.so)
        run: |
          mkdir -p prebuilt/android
          cd rust && cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../prebuilt/android build --release
          cd ..
          tar -czf libeasy_monitoring-android-jniLibs.tar.gz -C prebuilt/android .
      - uses: actions/upload-artifact@v4
        with:
          name: android-binary
          path: libeasy_monitoring-android-jniLibs.tar.gz

  build-windows:
    name: Build Windows Binary (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Compile Windows DLL (.dll)
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path prebuilt/windows
          Copy-Item rust/target/x86_64-pc-windows-msvc/release/easy_monitoring.dll prebuilt/windows/easy_monitoring.dll
          Copy-Item prebuilt/windows/easy_monitoring.dll easy_monitoring-windows-x86_64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: easy_monitoring-windows-x86_64.dll

  release:
    name: Attach Binaries to GitHub Release
    needs: [build-macos, build-ios, build-linux, build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-binary/libeasy_monitoring-macos-universal.dylib
            artifacts/ios-binary/libeasy_monitoring-ios-arm64.a
            artifacts/linux-binary/libeasy_monitoring-linux-x86_64.so
            artifacts/android-binary/libeasy_monitoring-android-jniLibs.tar.gz
            artifacts/windows-binary/easy_monitoring-windows-x86_64.dll

  publish:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
