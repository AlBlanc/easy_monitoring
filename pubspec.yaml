name: easy_monitoring
description: >-
  Real-time CPU, RAM, GPU, and current process hardware monitoring library for Flutter
  (Windows, macOS, Linux, Android, iOS) powered by Rust (sysinfo & gfxinfo) and exposed via Dart Streams.
version: 0.1.1-1
homepage: https://github.com/AlBlanc/easy_monitoring
repository: https://github.com/AlBlanc/easy_monitoring

environment:
  sdk: ^3.3.0
  flutter: '>=3.19.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  test: ^1.25.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
